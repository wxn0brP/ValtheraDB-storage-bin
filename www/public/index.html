<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Advanced File Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Valthera Binary File Analyzer</h1>
    <div class="card">
        <h2>Load File</h2>
        <div class="input-group">
            <input type="text" id="db-path" placeholder="Enter database file path">
            <button id="browse-files">Browse</button>
            <button id="load-db">Load</button>
        </div>
    </div>

    <div id="file-selector-popup" class="popup-overlay">
        <div class="popup-content">
            <div class="popup-header">
                <h2>Select Database File</h2>
                <span id="close-popup" class="close-btn">&times;</span>
            </div>
            <div class="popup-body">
                <div class="path-navigation">
                    <span id="current-path">/</span>
                </div>
                <div class="filter-options">
                    <label>
                        <input type="checkbox" id="show-all-files"> Show all files
                    </label>
                </div>
                <br>
                <div class="file-list" id="file-list"></div>
            </div>
            <div class="popup-footer">
                <button id="select-file-btn" class="btn-primary" disabled>Select File</button>
                <button id="cancel-popup" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>
    <div class="grid">
        <div class="card">
            <h2>File Header</h2>
            <pre id="header-output"></pre>
        </div>
        <div class="card">
            <h2>Hex Viewer</h2>
            <pre id="hex-output"></pre>
            <div class="hex-view-controls">
                <button id="prev-chunk">Previous</button>
                <button id="next-chunk">Next</button>
            </div>
        </div>
        <div class="card" style="grid-column: span 2;">
            <h2>Collection Data</h2>
            <div class="input-group">
                <select id="collections"></select>
                <button id="view-collection">View</button>
            </div>
            <pre id="json-output"></pre>
        </div>
    </div>

    <script src="index.js" type="module"></script>
</body>

</html>
